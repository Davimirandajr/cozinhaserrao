<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozinha Serrão </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { 
        --olive: #4a5d23; 
        --olive-dark: #36441a;
        --rust: #8b4513; 
        --cream: #fdfaf0; 
        --paper-texture: url('https://www.transparenttextures.com/patterns/cream-paper.png');
    }
    
    body { 
        background-color: #d1d1d1; 
        font-family: 'Poppins', sans-serif;
        background-image: url('https://www.transparenttextures.com/patterns/pinstriped-suit.png');
        margin: 0;
        padding: 0; /* Mobile-first: sem padding nas bordas */
    }
    
    .main-frame {
        background-color: var(--cream);
        background-image: var(--paper-texture);
        max-width: 850px;
        margin: 0 auto;
        border: 8px solid white; /* Moldura menor no mobile */
        outline: 1px solid rgba(74, 93, 35, 0.2);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        min-height: 100vh;
    }

    /* Ajustes para Desktop */
    @media (min-width: 640px) {
        body { padding: 20px; }
        .main-frame { 
            margin: 20px auto; 
            border: 15px solid white; 
            border-radius: 4px;
            min-height: auto;
        }
    }

    .font-serif { font-family: 'Playfair Display', serif; }
    
    .product-card {
        background: white;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Melhora o toque no mobile */
    input, select, button {
        font-size: 16px !important; /* Impede zoom forçado no iOS */
        min-height: 48px;
    }

    .method-active {
        background-color: var(--olive) !important;
        color: white !important;
        border-color: var(--olive-dark) !important;
        transform: translateY(-2px);
    }

    .btn-whatsapp {
        background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
        transition: all 0.3s ease;
    }

    #carrinho-bar {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
    }
</style>
</head>
<body class="p-2 sm:p-6">

<div class="main-frame p-4 sm:p-10">
    <header class="text-center mb-8">
        <img src="image/Capturar.PNG" alt="Cozinha Serrão" class="w-48 sm:w-56 mx-auto mb-4 drop-shadow-sm">
        <div class="flex items-center justify-center gap-3 italic text-[var(--olive)] opacity-80">
            <div class="h-[1px] w-8 bg-[var(--olive)]"></div>
            <span class="text-[10px] sm:text-xs uppercase tracking-widest font-bold">Sexta, Sábado e Domingo</span>
            <div class="h-[1px] w-8 bg-[var(--olive)]"></div>
        </div>
    </header>

    <section>
        <div class="mb-6 border-b-2 border-stone-200 pb-4">
            <span class="text-[var(--rust)] font-bold text-[10px] uppercase tracking-[3px] block mb-1">Tradição & Tempero</span>
            <h2 class="font-serif text-2xl sm:text-3xl text-[var(--olive)] italic leading-none">O Sabor de Hoje</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mb-12">
            <div class="product-card shadow-sm">
                <div class="relative">
                    <img src="https://guiadacozinha.com.br/wp-content/uploads/2020/01/feijoada-completa-tradicional.jpg" class="w-full h-40 object-cover">
                    <span class="absolute top-2 right-2 bg-white/90 px-2 py-1 rounded text-[10px] font-bold text-[var(--olive)] uppercase">Completa</span>
                </div>
                <div class="p-4 flex flex-col justify-between flex-1">
                    <div>
                        <h3 class="font-bold text-lg text-stone-800 leading-tight">Feijoada no Balde</h3>
                        <p class="text-[11px] text-stone-500 mb-4 italic">Arroz soltinho, farofa e couve.</p>
                        <select id="size-feijoada" class="w-full p-2 text-sm border rounded-lg mb-3 bg-stone-50">
                            <option value="165.00">1.5L (6 Pessoas) - R$ 165,00</option>
                            <option value="100.00" selected>750ml (3 Pessoas) - R$ 100,00</option>
                            <option value="70.00">500ml (2 Pessoas) - R$ 70,00</option>
                            <option value="35.00">250ml (1 Pessoa) - R$ 35,00</option>
                        </select>
                    </div>
                    <button onclick="adicionar('Feijoada', 'size-feijoada')" class="w-full bg-[var(--olive)] text-white py-3 rounded-xl font-bold active:bg-black transition-all text-sm shadow-md">Adicionar à Sacola</button>
                </div>
            </div>

            <div class="product-card shadow-sm">
                <div class="relative">
                    <img src="image/mocoto.jpg" class="w-full h-40 object-cover">
                    <span class="absolute top-2 right-2 bg-white/90 px-2 py-1 rounded text-[10px] font-bold text-[var(--olive)] uppercase">Tradicional</span>
                </div>
                <div class="p-4 flex flex-col justify-between flex-1">
                    <div>
                        <h3 class="font-bold text-lg text-stone-800 leading-tight">Mocotó no Balde</h3>
                        <p class="text-[11px] text-stone-500 mb-4 italic">Caldo grosso, arroz e farofa especial.</p>
                        <select id="size-mocoto" class="w-full p-2 text-sm border rounded-lg mb-3 bg-stone-50">
                            <option value="165.00">1.5L (6 Pessoas) - R$ 165,00</option>
                            <option value="100.00" selected>750ml (3 Pessoas) - R$ 100,00</option>
                            <option value="70.00">500ml (2 Pessoas) - R$ 70,00</option>
                            <option value="35.00">250ml (1 Pessoa) - R$ 35,00</option>
                        </select>
                    </div>
                    <button onclick="adicionar('Mocotó', 'size-mocoto')" class="w-full bg-[var(--olive)] text-white py-3 rounded-xl font-bold active:bg-black transition-all text-sm shadow-md">Adicionar à Sacola</button>
                </div>
            </div>
        </div>
    </section>

    <section class="bg-white/60 p-4 sm:p-8 rounded-2xl border border-stone-200 shadow-inner mb-20">
        <h2 class="font-serif text-xl text-[var(--olive)] mb-6 text-center italic">Dados de Entrega</h2>
        
        <div class="flex gap-2 mb-6">
            <button id="btn-entrega" onclick="setMetodo('entrega')" class="method-active flex-1 py-3 rounded-xl font-bold border-2 text-[10px] sm:text-xs tracking-wider shadow-sm uppercase">🛵 Entrega</button>
            <button id="btn-retirada" onclick="setMetodo('retirada')" class="flex-1 py-3 rounded-xl font-bold border-2 border-stone-200 text-stone-400 bg-white text-[10px] sm:text-xs tracking-wider uppercase">🏢 Retirada</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-[9px] font-bold text-stone-400 uppercase ml-1">Nome do Cliente</label>
                <input type="text" id="nome" placeholder="Ex: Davi Gomes" class="w-full p-3 rounded-xl border-stone-200 bg-white">
            </div>
            <div class="space-y-1">
                <label class="text-[9px] font-bold text-stone-400 uppercase ml-1">Referência</label>
                <input type="text" id="ref" placeholder="Ex: Perto da praça" class="w-full p-3 rounded-xl border-stone-200 bg-white">
            </div>
            <div class="sm:col-span-2 space-y-3" id="secao-endereco">
                <button onclick="pegarLocalizacao()" class="w-full bg-white border-2 border-[var(--olive)] text-[var(--olive)] py-3 rounded-xl font-bold text-xs shadow-sm active:scale-95 transition-transform">
                    📍 Localização via GPS
                </button>
                <input type="text" id="endereco" placeholder="Rua, Número e Bairro" class="w-full p-3 rounded-xl border-stone-200 bg-white">
            </div>
        </div>
    </section>
</div>

    <script>
        let sacola = [];
        let total = 0;
        let metodo = 'entrega';

        function setMetodo(tipo) {
            metodo = tipo;
            const btnE = document.getElementById('btn-entrega');
            const btnR = document.getElementById('btn-retirada');
            const secaoEnd = document.getElementById('secao-endereco');

            if(tipo === 'entrega') {
                btnE.classList.add('method-active');
                btnR.classList.remove('method-active');
                secaoEnd.classList.remove('hidden');
            } else {
                btnR.classList.add('method-active');
                btnE.classList.remove('method-active');
                secaoEnd.classList.add('hidden');
            }
        }

        function adicionar(nome, selectId) {
            const select = document.getElementById(selectId);
            const preco = parseFloat(select.value);
            const tamanho = select.options[select.selectedIndex].text.split(' - ')[0];
            
            sacola.push({ item: `${nome} (${tamanho})`, preco });
            total += preco;
            
            // Animação da barra surgindo
            const bar = document.getElementById('carrinho-bar');
            bar.style.transform = "translateY(0)";
            
            document.getElementById('itens-qtd').innerText = `${sacola.length} ITEM(NS) SELECIONADOS`;
            document.getElementById('total-val').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            
            // Pequeno feedback no botão
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "✓ Adicionado!";
            btn.classList.replace('bg-[var(--olive)]', 'bg-black');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-black', 'bg-[var(--olive)]');
            }, 1000);
        }

        async function pegarLocalizacao() {
            const field = document.getElementById('endereco');
            const btn = event.target;
            btn.innerText = "Buscando localização...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`);
                        const data = await res.json();
                        field.value = data.display_name.split(',').slice(0,4).join(',');
                        btn.innerText = "📍 Localização Atualizada!";
                    } catch (e) {
                        alert("Erro ao buscar endereço.");
                        btn.innerText = "📍 Tentar Novamente";
                    }
                }, () => {
                    alert("Acesso negado ao GPS.");
                    btn.innerText = "📍 GPS Desativado";
                });
            }
        }

        function finalizarPedido() {
            const nome = document.getElementById('nome').value;
            const end = document.getElementById('endereco').value;
            const ref = document.getElementById('ref').value;

            if (!nome) return alert("Por favor, preencha seu nome.");
            if (metodo === 'entrega' && !end) return alert("Preencha o endereço de entrega.");

            const resumo = sacola.map(i => `• *${i.item}*`).join('\n');
            const infoMetodo = metodo === 'entrega' 
                ? `📍 *ENTREGA EM:* ${end}\n🏠 *REF:* ${ref}` 
                : `🏢 *RETIRADA:* Vou buscar no local`;

            const msg = encodeURIComponent(
                `🥘 *COZINHA SERRÃO - NOVO PEDIDO*\n` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `👤 *CLIENTE:* ${nome}\n` +
                `${infoMetodo}\n` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `🛒 *PEDIDO:* \n${resumo}\n\n` +
                `💰 *TOTAL: R$ ${total.toFixed(2).replace('.', ',')}*\n` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `_Aguardando confirmação e chave PIX._`
            );

            window.open(`https://wa.me/5598981576036?text=${msg}`);
        }
    </script>
</body>
</html>
